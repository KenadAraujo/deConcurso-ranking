spring.application.name=ranking

# ===============================
# CONFIGURACAO DO POSTGRES
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/ranking
spring.datasource.username=admin
spring.datasource.password=admin

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACAO DO JPA / HIBERNATE
# ===============================

# Mostra os SQLs no console
spring.jpa.show-sql=true

# Formata o SQL para leitura
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do PostgreSQL (ajuda o Hibernate a gerar SQLs compat�veis)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Atualiza automaticamente o schema (use create, update, none, validate)
spring.jpa.hibernate.ddl-auto=none

# ===============================
# CONFIGURACAO DO FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.schemas=public
spring.flyway.default-schema=public

# ===============================
# CONFIGURACAO DO SWAGGER
# ===============================
springdoc.api-docs.path: /api-docs
springdoc.swagger-ui.path: /docs
springdoc.swagger-ui.operations-sorter: method
springdoc.packages-to-scan: com.polligonalapps.deconcurso.ranking.controller